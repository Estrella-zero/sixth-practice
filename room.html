<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校自习室开放统计</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">自习室数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：课程统一数据集</p>
  </header>

  <p id="status" class="alert alert-warning"></p>
  <div class = "mb-3"> 
    <button class = "btn btn-outline-primary btn-sm" id = "btn-all" >全部</button > 
    <button class = "btn btn-outline-success btn-sm" id = "btn-open">只看开放</button > 
    <button class = "btn btn-outline-danger btn-sm" id = "btn-free">有空座</button > </div>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各自习室座位剩余量（ECharts柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">借阅趋势（Chart.js折线图）</h2>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">自习室分布区占比（Echarts饼状图）</h2>
      <div class="chart-box" id="pie-chart"></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="study.js"></script>
</body>
</html>
